name: Build Libron Cyrillic

on:
  push:
    branches: [main, develop]
    tags: ["cyrillic-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nicoverbruggen/fntbld-oci:latest
    steps:
      - uses: actions/checkout@v5
      - name: Build fonts
        run: python3 build.py
      - name: Check Cyrillic shaping and coverage
        run: python3 scripts/validate_cyrillic.py
      - name: Validate OpenType tables
        run: |
          for font in out/ttf/*.ttf out/web/*.woff2; do
            ots-sanitize "$font"
          done
      - name: Upload fonts
        uses: actions/upload-artifact@v6
        with:
          name: Libron-Cyrillic
          path: |
            out/ttf/*.ttf
            out/web/*.woff2
          if-no-files-found: error
